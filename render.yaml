services:
  - type: web
    name: orbit-har-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CLOUD_MODE
        value: "true"
      - key: PYTHONIOENCODING
        value: utf-8
